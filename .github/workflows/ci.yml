name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: Game core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build and test GameCore
        run: swift test --package-path Packages/GameCore --parallel

  app-macos:
    name: iOS app build and UI test (macOS)
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install xcodegen swiftlint
      - name: Lint
        run: swiftlint lint --quiet
      - name: Game core tests (macOS)
        run: swift test --package-path Packages/GameCore
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 1[5-9]" | head -1 | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build and run UI smoke test
        run: |
          set -o pipefail
          xcodebuild test \
            -project DoctorsWorld.xcodeproj \
            -scheme DoctorsWorld \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tail -n 80
      - name: Take screenshots on iPhone and iPad
        run: |
          set -euo pipefail
          UUID_RE='[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}'
          IPHONE="${{ steps.sim.outputs.udid }}"
          IPAD=$(xcrun simctl list devices available | grep -E "iPad (Pro|Air)" | head -1 | grep -oE "$UUID_RE")
          # Reuse the app the UI test just built instead of building again.
          APP=$(find build/Build/Products -name "DoctorsWorld.app" -path "*iphonesimulator*" | head -1)
          mkdir -p screenshots
          for DEV in "$IPHONE" "$IPAD"; do
            NAME=$(xcrun simctl list devices | grep "$DEV" | head -1 | sed -E 's/^ *([^(]+) \(.*/\1/' | tr ' ' '-')
            xcrun simctl boot "$DEV" || true
            xcrun simctl bootstatus "$DEV" -b
            xcrun simctl status_bar "$DEV" override --time "9:41" --batteryState charged --batteryLevel 100 || true
            xcrun simctl install "$DEV" "$APP"
            xcrun simctl launch "$DEV" com.harshaldhote.doctorsworld
            sleep 5
            xcrun simctl io "$DEV" screenshot "screenshots/${NAME}.png"
            echo "Saved screenshots/${NAME}.png"
          done
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
      - name: Publish screenshots to the screenshots branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          SHOTS=$(mktemp -d)
          cp screenshots/*.png "$SHOTS"/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan screenshots-latest
          git rm -rf --quiet .
          git clean -fdxq
          cp "$SHOTS"/*.png .
          {
            echo "# Screenshots"
            echo
            echo "Title screen as of commit ${GITHUB_SHA}, captured automatically by CI."
            for f in *.png; do echo; echo "![${f%.png}]($f)"; done
          } > README.md
          git add -A
          git commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -qf origin HEAD:screenshots
