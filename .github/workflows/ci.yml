name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_RELEASE: https://github.com/godotengine/godot/releases/download/4.7.2-stable

jobs:
  game-linux:
    name: Tests and screenshots (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-linux-${{ env.GODOT_VERSION }}

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$GODOT_RELEASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot

      - name: Install a virtual screen for rendering
        run: sudo apt-get update -q && sudo apt-get install -yq xvfb libgl1-mesa-dri mesa-utils

      - name: Import the project
        run: ~/godot/godot --headless --path . --import

      - name: Tests
        run: ~/godot/godot --headless --path . -s res://tests/run_tests.gd

      - name: The exported game carries the story files
        # Stories are plain JSON, which Godot leaves out of an export unless
        # the preset's include filter names them.
        run: |
          ~/godot/godot --headless --path . --export-pack "iOS" /tmp/game.pck
          for chapter in cast opening day1 banter training theatre cases ward junior; do
            grep -a -q "story/$chapter.json" /tmp/game.pck || { echo "story/$chapter.json is missing from the export"; exit 1; }
          done

      - name: Screenshots (iPhone and iPad)
        run: |
          set -o pipefail
          mkdir -p screenshots
          for device in "iphone 1688x780" "ipad 2048x1536"; do
            set -- $device
            xvfb-run -a -s "-screen 0 2400x1600x24" ~/godot/godot --path . --resolution "$2" \
              -s res://tools/screenshots.gd -- screenshots "$1" 2>&1 | tee "shots-$1.log"
          done
          # A script error while drawing a screen fails the build.
          if grep -h "SCRIPT ERROR" shots-*.log; then exit 1; fi
          ls -la screenshots
          test "$(ls screenshots/*.png | wc -l)" -eq 142

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/

      - name: Publish screenshots to the screenshots branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          SHOTS=$(mktemp -d)
          cp screenshots/*.png "$SHOTS"/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan screenshots-latest
          git rm -rf --quiet .
          git clean -fdxq
          cp "$SHOTS"/*.png .
          {
            echo "# Screenshots"
            echo
            echo "Screens as of commit ${GITHUB_SHA}, drawn automatically by CI."
            for f in *.png; do echo; echo "![${f%.png}]($f)"; done
          } > README.md
          git add -A
          git commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -qf origin HEAD:screenshots

  ios-macos:
    name: iOS build (macOS)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and the iOS template
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/Library/Application Support/Godot/export_templates
          key: godot-macos-ios-${{ env.GODOT_VERSION }}

      - name: Download Godot and the iOS export template
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$GODOT_RELEASE/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          curl -fsSL -o /tmp/templates.tpz "$GODOT_RELEASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          TEMPLATES="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATES"
          unzip -q -j /tmp/templates.tpz templates/ios.zip templates/version.txt -d "$TEMPLATES"
          rm /tmp/templates.tpz
          ls -la "$TEMPLATES"

      - name: Use Xcode 26
        # Godot 4.7's iOS library is built against the iOS 26 SDK (it uses
        # Metal and Core Animation symbols that older SDKs lack).
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "No Xcode 26 on this runner"; exit 1; fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Import the project
        run: ~/godot/Godot.app/Contents/MacOS/Godot --headless --path . --import

      - name: Export the Xcode project
        run: |
          set -o pipefail
          mkdir -p build/ios
          ~/godot/Godot.app/Contents/MacOS/Godot --headless --path . --export-debug "iOS" build/ios/DoctorsWorld.ipa 2>&1 \
            | tee export.log
          ls -la build/ios
          test -d build/ios/DoctorsWorld.xcodeproj

      - name: Build the app for iPhone and iPad (unsigned)
        # Godot's iOS template ships an arm64 device library (its simulator
        # library is Intel only), so CI builds the real device app with code
        # signing turned off. Signing happens on your Mac, see DEVELOPMENT.md.
        run: |
          set -o pipefail
          xcodebuild build \
            -project build/ios/DoctorsWorld.xcodeproj \
            -scheme DoctorsWorld \
            -configuration Debug \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/derived \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -n 40
          APP=build/derived/Build/Products/Debug-iphoneos/DoctorsWorld.app
          ls -la "$APP"
          lipo -info "$APP/DoctorsWorld"
