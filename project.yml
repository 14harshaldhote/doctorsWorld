# XcodeGen spec. Run `xcodegen generate` to create DoctorsWorld.xcodeproj.
# The .xcodeproj is not committed, so it never causes merge conflicts.
name: DoctorsWorld
options:
  bundleIdPrefix: com.harshaldhote
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  GameCore:
    path: Packages/GameCore

targets:
  DoctorsWorld:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: GameCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harshaldhote.doctorsworld
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Doctors World
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.simulation-games
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight

  DoctorsWorldUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: DoctorsWorld
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harshaldhote.doctorsworld.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DoctorsWorld

schemes:
  DoctorsWorld:
    build:
      targets:
        DoctorsWorld: all
    test:
      targets:
        - DoctorsWorldUITests
